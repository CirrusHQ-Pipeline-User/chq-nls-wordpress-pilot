AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Security tier. Security groups chained ALB -> App -> DB so each tier only
  accepts traffic from the tier in front of it.

Parameters:
  EnvironmentName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
  AppPort:
    Type: Number
  DbPort:
    Type: Number
  CreateDbSecurityGroup:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  HasDbSecurityGroup: !Equals [!Ref CreateDbSecurityGroup, 'true']

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} ALB - HTTP/HTTPS in, app port out to VPC'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedIngressCidr, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedIngressCidr, Description: HTTPS }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: !Ref AppPort, ToPort: !Ref AppPort, CidrIp: !Ref VpcCidr, Description: To app tier and health checks }
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-alb-sg' }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} App - app port from ALB only'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: 'Outbound via NAT for patching, SSM and CloudWatch' }
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-app-sg' }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasDbSecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} DB - database port from app tier only'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: From app tier
      SecurityGroupEgress:
        # Placeholder rule that removes the default allow-all egress; RDS needs no outbound access.
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: No outbound required }
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-db-sg' }

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  DbSecurityGroupId:
    Condition: HasDbSecurityGroup
    Value: !Ref DbSecurityGroup
