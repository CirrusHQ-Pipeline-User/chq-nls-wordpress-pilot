AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Data tier (optional). Encrypted Amazon RDS instance in isolated data subnets.
  The master password is generated and rotated-ready in AWS Secrets Manager.

Parameters:
  EnvironmentName:
    Type: String
  DataSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbEngine:
    Type: String
    AllowedValues: [postgres, mysql]
  DbEngineVersion:
    Type: String
    Default: ''
  DbPort:
    Type: Number
  DbInstanceClass:
    Type: String
  DbAllocatedStorage:
    Type: Number
  DbMaxAllocatedStorage:
    Type: Number
  DbName:
    Type: String
  DbMasterUsername:
    Type: String
  DbMultiAZ:
    Type: String
    AllowedValues: ['true', 'false']
  DbBackupRetentionDays:
    Type: Number
  DbDeletionProtection:
    Type: String
    AllowedValues: ['true', 'false']

Conditions:
  HasEngineVersion: !Not [!Equals [!Ref DbEngineVersion, '']]
  IsPostgres: !Equals [!Ref DbEngine, postgres]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${EnvironmentName} data subnets'
      SubnetIds: !Ref DataSubnetIds
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-db-subnets' }

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: !Ref DbEngine
      EngineVersion: !If [HasEngineVersion, !Ref DbEngineVersion, !Ref AWS::NoValue]
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: !Ref DbMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      Port: !Ref DbPort
      MultiAZ: !Ref DbMultiAZ
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroupId]
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !Ref DbDeletionProtection
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: !If
        - IsPostgres
        - [postgresql, upgrade]
        - [error, slowquery]
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-db' }

Outputs:
  DbInstanceId:
    Value: !Ref DbInstance
  DbEndpointAddress:
    Value: !GetAtt DbInstance.Endpoint.Address
  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
  DbSecretArn:
    Value: !GetAtt DbInstance.MasterUserSecret.SecretArn
