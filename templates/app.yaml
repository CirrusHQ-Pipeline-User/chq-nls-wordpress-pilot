AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Application tier. EC2 Auto Scaling group in the private subnets of both AZs,
  registered with the ALB target group. No SSH / key pairs - access is via SSM
  Session Manager. Instances signal CloudFormation once the app is healthy.

Parameters:
  EnvironmentName:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  TargetGroupArn:
    Type: String
  AppPort:
    Type: Number
  InstanceType:
    Type: String
  AmiId:
    Type: AWS::EC2::Image::Id
  RootVolumeSize:
    Type: Number
    Default: 20
  MinSize:
    Type: Number
  MaxSize:
    Type: Number
  DesiredCapacity:
    Type: Number
  CpuTargetUtilization:
    Type: Number
    Default: 60
  DbEndpoint:
    Type: String
    Default: ''
  DbSecretArn:
    Type: String
    Default: ''

Conditions:
  HasDbSecret: !Not [!Equals [!Ref DbSecretArn, '']]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub '${EnvironmentName} app tier EC2 role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies: !If
        - HasDbSecret
        - - PolicyName: read-db-secret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DbSecretArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-app-role' }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds: [!Ref AppSecurityGroupId]
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref RootVolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub '${EnvironmentName}-app' }
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: !Sub '${EnvironmentName}-app' }
        # Placeholder workload: nginx serving an instance/AZ page and /health.
        # Replace the "application" section with the real install steps.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee /var/log/user-data.log) 2>&1

            signal() {
              /opt/aws/bin/cfn-signal -e "$1" --stack '${AWS::StackName}' --resource AutoScalingGroup --region '${AWS::Region}' || true
            }
            trap 'signal 1' ERR

            dnf -y install aws-cfn-bootstrap nginx

            TOKEN=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
            IID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

            # Runtime settings for the application
            mkdir -p /etc/app
            cat > /etc/app/app.env <<EOF
            ENVIRONMENT=${EnvironmentName}
            AWS_REGION=${AWS::Region}
            DB_HOST=${DbEndpoint}
            DB_SECRET_ARN=${DbSecretArn}
            EOF
            chmod 600 /etc/app/app.env

            # ---- application (placeholder) ----
            mkdir -p /usr/share/nginx/html/app
            cat > /usr/share/nginx/html/app/index.html <<EOF
            <!doctype html><html><body>
            <h1>${EnvironmentName}</h1>
            <p>Instance: $IID</p><p>Availability Zone: $AZ</p>
            </body></html>
            EOF

            cat > /etc/nginx/nginx.conf <<'NGINX'
            user nginx;
            worker_processes auto;
            error_log /var/log/nginx/error.log notice;
            pid /run/nginx.pid;
            include /usr/share/nginx/modules/*.conf;
            events { worker_connections 1024; }
            http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              access_log /var/log/nginx/access.log;
              sendfile on;
              server_tokens off;
              server {
                listen ${AppPort} default_server;
                root /usr/share/nginx/html/app;
                index index.html;
                location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
                location / { try_files $uri $uri/ =404; }
              }
            }
            NGINX

            systemctl enable --now nginx
            curl -fsS http://localhost:${AppPort}/health
            # ---- end application ----

            signal 0

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref DesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
          - AZRebalance
          - AlarmNotification
          - ScheduledActions
    Properties:
      VPCZoneIdentifier: !Ref PrivateSubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref TargetGroupArn]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-app', PropagateAtLaunch: true }

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetUtilization

Outputs:
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
