AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Multi-tier web architecture (root stack). VPC across two Availability Zones,
  internet-facing ALB protected by AWS WAF, private EC2 Auto Scaling group, and
  optional data subnets / Amazon RDS database.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: General }
        Parameters: [EnvironmentName, LogRetentionDays]
      - Label: { default: Network }
        Parameters:
          - VpcCidr
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
          - CreateDataSubnets
          - DataSubnet1Cidr
          - DataSubnet2Cidr
          - NatGatewayMode
          - EnableFlowLogs
      - Label: { default: Load balancer and WAF }
        Parameters:
          - AllowedIngressCidr
          - CertificateArn
          - HealthCheckPath
          - WafRateLimit
          - EnableWafLogging
      - Label: { default: Application tier (EC2) }
        Parameters:
          - AppPort
          - InstanceType
          - AmiId
          - RootVolumeSize
          - MinSize
          - MaxSize
          - DesiredCapacity
          - CpuTargetUtilization
      - Label: { default: Database tier (optional) }
        Parameters:
          - CreateDatabase
          - DbEngine
          - DbEngineVersion
          - DbInstanceClass
          - DbAllocatedStorage
          - DbMaxAllocatedStorage
          - DbName
          - DbMasterUsername
          - DbMultiAZ
          - DbBackupRetentionDays
          - DbDeletionProtection

Parameters:
  # ---------------------------------------------------------------- General
  EnvironmentName:
    Type: String
    Description: Short lowercase name used to prefix resource names and exports (e.g. nls-dev). Must be unique per account/region.
    AllowedPattern: '^[a-z][a-z0-9-]{1,19}$'
    ConstraintDescription: 2-20 chars, lowercase letters, digits and hyphens, starting with a letter.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention for CloudWatch log groups created by this solution (VPC flow logs, WAF logs).

  # ---------------------------------------------------------------- Network
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  CreateDataSubnets:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create isolated data subnets (no internet route). Forced on when CreateDatabase is true.
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.20.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.21.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
  NatGatewayMode:
    Type: String
    Default: PerAZ
    AllowedValues: [Single, PerAZ]
    Description: PerAZ = one NAT gateway per AZ (highly available). Single = one shared NAT gateway (cheaper, for dev/test).
  EnableFlowLogs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  # ---------------------------------------------------------------- ALB / WAF
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'
    Description: CIDR allowed to reach the load balancer on 80/443.
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN (same region). When set, an HTTPS listener is created and HTTP redirects to HTTPS.
  HealthCheckPath:
    Type: String
    Default: /health
  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 2000000000
    Description: Maximum requests per source IP in any 5-minute window before WAF blocks it.
  EnableWafLogging:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  # ---------------------------------------------------------------- App tier
  AppPort:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
    Description: Port the application listens on in the EC2 instances.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type. Must match the AMI architecture (x86_64 by default).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter path for the AMI. Defaults to the latest Amazon Linux 2023 (x86_64).
  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 1024
  MinSize:
    Type: Number
    Default: 2
    MinValue: 0
  MaxSize:
    Type: Number
    Default: 4
    MinValue: 1
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 0
  CpuTargetUtilization:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90

  # ---------------------------------------------------------------- Database
  CreateDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create an Amazon RDS instance in the data subnets.
  DbEngine:
    Type: String
    Default: postgres
    AllowedValues: [postgres, mysql]
  DbEngineVersion:
    Type: String
    Default: ''
    Description: Optional engine version (e.g. 16.4). Leave blank for the RDS default.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
  DbMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 65536
    Description: Upper limit for storage autoscaling (GiB). Must be greater than DbAllocatedStorage.
  DbName:
    Type: String
    Default: appdb
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]{0,62}$'
  DbMasterUsername:
    Type: String
    Default: dbadmin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,15}$'
    Description: Master username. The password is generated and stored in AWS Secrets Manager by RDS.
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  DbDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Mappings:
  DbEngineMap:
    postgres: { Port: '5432' }
    mysql: { Port: '3306' }

Conditions:
  ShouldCreateDatabase: !Equals [!Ref CreateDatabase, 'true']
  ShouldCreateDataSubnets: !Or
    - !Equals [!Ref CreateDataSubnets, 'true']
    - !Condition ShouldCreateDatabase
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: network.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
        CreateDataSubnets: !If [ShouldCreateDataSubnets, 'true', 'false']
        DataSubnet1Cidr: !Ref DataSubnet1Cidr
        DataSubnet2Cidr: !Ref DataSubnet2Cidr
        NatGatewayMode: !Ref NatGatewayMode
        EnableFlowLogs: !Ref EnableFlowLogs
        LogRetentionDays: !Ref LogRetentionDays

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: security.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
        AllowedIngressCidr: !Ref AllowedIngressCidr
        AppPort: !Ref AppPort
        DbPort: !FindInMap [DbEngineMap, !Ref DbEngine, Port]
        CreateDbSecurityGroup: !If [ShouldCreateDatabase, 'true', 'false']

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateDatabase
    Properties:
      TemplateURL: database.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DataSubnetIds: !GetAtt NetworkStack.Outputs.DataSubnetIds
        DbSecurityGroupId: !GetAtt SecurityStack.Outputs.DbSecurityGroupId
        DbEngine: !Ref DbEngine
        DbEngineVersion: !Ref DbEngineVersion
        DbPort: !FindInMap [DbEngineMap, !Ref DbEngine, Port]
        DbInstanceClass: !Ref DbInstanceClass
        DbAllocatedStorage: !Ref DbAllocatedStorage
        DbMaxAllocatedStorage: !Ref DbMaxAllocatedStorage
        DbName: !Ref DbName
        DbMasterUsername: !Ref DbMasterUsername
        DbMultiAZ: !Ref DbMultiAZ
        DbBackupRetentionDays: !Ref DbBackupRetentionDays
        DbDeletionProtection: !Ref DbDeletionProtection

  AlbStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: alb.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        AppPort: !Ref AppPort
        HealthCheckPath: !Ref HealthCheckPath
        CertificateArn: !Ref CertificateArn

  WafStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: waf.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        LoadBalancerArn: !GetAtt AlbStack.Outputs.LoadBalancerArn
        RateLimit: !Ref WafRateLimit
        IncludeSqliRules: !If [ShouldCreateDatabase, 'true', 'false']
        EnableLogging: !Ref EnableWafLogging
        LogRetentionDays: !Ref LogRetentionDays

  AppStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: app.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        AppSecurityGroupId: !GetAtt SecurityStack.Outputs.AppSecurityGroupId
        TargetGroupArn: !GetAtt AlbStack.Outputs.TargetGroupArn
        AppPort: !Ref AppPort
        InstanceType: !Ref InstanceType
        AmiId: !Ref AmiId
        RootVolumeSize: !Ref RootVolumeSize
        MinSize: !Ref MinSize
        MaxSize: !Ref MaxSize
        DesiredCapacity: !Ref DesiredCapacity
        CpuTargetUtilization: !Ref CpuTargetUtilization
        DbEndpoint: !If [ShouldCreateDatabase, !GetAtt DatabaseStack.Outputs.DbEndpointAddress, '']
        DbSecretArn: !If [ShouldCreateDatabase, !GetAtt DatabaseStack.Outputs.DbSecretArn, '']

Outputs:
  ApplicationUrl:
    Description: URL of the application load balancer
    Value: !If
      - HasCertificate
      - !Sub 'https://${AlbStack.Outputs.LoadBalancerDnsName}'
      - !Sub 'http://${AlbStack.Outputs.LoadBalancerDnsName}'
  LoadBalancerDnsName:
    Value: !GetAtt AlbStack.Outputs.LoadBalancerDnsName
    Export: { Name: !Sub '${EnvironmentName}-AlbDnsName' }
  LoadBalancerArn:
    Value: !GetAtt AlbStack.Outputs.LoadBalancerArn
    Export: { Name: !Sub '${EnvironmentName}-AlbArn' }
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
    Export: { Name: !Sub '${EnvironmentName}-VpcId' }
  PublicSubnetIds:
    Value: !GetAtt NetworkStack.Outputs.PublicSubnetIds
    Export: { Name: !Sub '${EnvironmentName}-PublicSubnetIds' }
  PrivateSubnetIds:
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
    Export: { Name: !Sub '${EnvironmentName}-PrivateSubnetIds' }
  DataSubnetIds:
    Condition: ShouldCreateDataSubnets
    Value: !GetAtt NetworkStack.Outputs.DataSubnetIds
    Export: { Name: !Sub '${EnvironmentName}-DataSubnetIds' }
  AppSecurityGroupId:
    Value: !GetAtt SecurityStack.Outputs.AppSecurityGroupId
    Export: { Name: !Sub '${EnvironmentName}-AppSecurityGroupId' }
  AutoScalingGroupName:
    Value: !GetAtt AppStack.Outputs.AutoScalingGroupName
    Export: { Name: !Sub '${EnvironmentName}-AsgName' }
  WebAclArn:
    Value: !GetAtt WafStack.Outputs.WebAclArn
    Export: { Name: !Sub '${EnvironmentName}-WebAclArn' }
  DbEndpointAddress:
    Condition: ShouldCreateDatabase
    Value: !GetAtt DatabaseStack.Outputs.DbEndpointAddress
    Export: { Name: !Sub '${EnvironmentName}-DbEndpoint' }
  DbSecretArn:
    Condition: ShouldCreateDatabase
    Description: Secrets Manager secret holding the RDS master credentials
    Value: !GetAtt DatabaseStack.Outputs.DbSecretArn
    Export: { Name: !Sub '${EnvironmentName}-DbSecretArn' }
