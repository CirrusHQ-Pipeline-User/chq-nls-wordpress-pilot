AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NLS WordPress - shared networking (nested in shared.yml, Deliverable D3.2).
  Two public ALB subnets in the Customer's existing VPC, the Internet Gateway
  (the LZA VPC has none), the public route table and the public subnet network
  ACL. No NAT Gateway or Elastic IP - private subnet egress is via the LZA's
  Transit Gateway subnets/attachment to the Network account's NAT Gateways.

Parameters:
  ApplicationName:
    Type: String
  Environment:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
  PublicSubnetCidrA:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-7])$'
    ConstraintDescription: An IPv4 CIDR of /27 or larger (an ALB needs at least 8 free addresses per subnet).
  PublicSubnetCidrB:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-7])$'
    ConstraintDescription: An IPv4 CIDR of /27 or larger (an ALB needs at least 8 free addresses per subnet).
  TargetPort:
    Type: Number

Resources:
  # ------------------------------------------------------------------ Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcId
      InternetGatewayId: !Ref InternetGateway

  # ------------------------------------------------------------------ Public ALB subnets
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PublicSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-public-alb-a'
        - Key: Tier
          Value: public

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PublicSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-public-alb-b'
        - Key: Tier
          Value: public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ------------------------------------------------------------------ Public network ACL
  # Stateless: each permitted flow has a matching rule in the other direction.
  # Inbound  100/110  HTTPS/HTTP from the internet (ALB listeners)
  #          120      ephemeral return traffic from the WordPress instances in the VPC
  # Outbound 100      ephemeral responses to internet clients
  #          110      ALB -> instances on TargetPort (traffic and health checks)
  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-public-nacl'

  PublicInHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Egress: false
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 443, To: 443 }

  PublicInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Egress: false
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 80, To: 80 }

  PublicInEphemeralFromVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Egress: false
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 1024, To: 65535 }

  PublicOutEphemeralToInternet:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Egress: true
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 1024, To: 65535 }

  PublicOutTargetPortToVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Egress: true
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref VpcCidr
      PortRange: { From: !Ref TargetPort, To: !Ref TargetPort }

  PublicSubnetANetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      NetworkAclId: !Ref PublicNetworkAcl

  PublicSubnetBNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      NetworkAclId: !Ref PublicNetworkAcl

Outputs:
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  PublicRouteTableId:
    Value: !Ref PublicRouteTable
  PublicNetworkAclId:
    Value: !Ref PublicNetworkAcl
  InternetGatewayId:
    Value: !Ref InternetGateway
