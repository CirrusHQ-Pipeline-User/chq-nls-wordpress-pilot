AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NLS WordPress - ingress for one WordPress server (nested in server.yml,
  Deliverable D3.3). An internet-facing Application Load Balancer in the two
  shared public subnets, a target group forwarding HTTP to the instance, and
  listeners: HTTPS (TLS 1.2 minimum) with HTTP redirected to it once a
  certificate is provided; plain HTTP forwarding until then, for
  infrastructure testing only.

Parameters:
  ApplicationName:
    Type: String
  Environment:
    Type: String
  ServerName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceId:
    Type: AWS::EC2::Instance::Id
  TargetPort:
    Type: Number
  HealthCheckPath:
    Type: String
  HealthCheckMatcher:
    Type: String
  CertificateArn:
    Type: String
    Default: ''
  SslPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06
  IdleTimeoutSeconds:
    Type: Number
    Default: 60

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ApplicationName}-${Environment}-${ServerName}'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroupId]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-${ServerName}-alb'

  # WordPress answers requests without a matching Host header with a 301 to
  # its site URL, so 3xx counts as healthy by default (HealthCheckMatcher).
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ApplicationName}-${Environment}-${ServerName}'
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: !Ref TargetPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: !Ref HealthCheckMatcher
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Targets:
        - Id: !Ref InstanceId
          Port: !Ref TargetPort
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-${ServerName}-tg'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              Host: '#{host}'
              Path: '/#{path}'
              Query: '#{query}'
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: !Ref SslPolicy
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
  HttpsListenerArn:
    Condition: HasCertificate
    Value: !Ref HttpsListener
