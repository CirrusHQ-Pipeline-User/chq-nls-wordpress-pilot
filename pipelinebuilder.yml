AWSTemplateFormatVersion: 2010-09-09
Description: Pipeline builder - pulls source from GitHub and deploys codepipeline.yml via ChangeSet

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod

  ConnectionArn:
    Type: String
    Description: CodeStar Connection ARN to GitHub (must be in AVAILABLE status)
    NoEcho: True

  FullRepositoryId:
    Type: String
    Description: GitHub repo in the form org/repo

  BranchName:
    Type: String
    Default: main

  ApprovalForCloudformationStage:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  ApplicationName:
    Type: String

Conditions:
  UseApproval: !Equals [!Ref ApprovalForCloudformationStage, "true"]

Resources:
  CFNRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F38
            reason: "CloudFormation deployment role requires broad permissions to create any resource type"
          - id: F3
            reason: "CloudFormation deployment role requires broad permissions to create any resource type"
          - id: W11
            reason: "CloudFormation deployment role requires broad permissions to create any resource type"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CloudFormationRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"

  PipelineRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F3
            reason: "Pipeline role requires broad permissions to orchestrate deployments"
          - id: W11
            reason: "Pipeline role requires broad permissions to orchestrate deployments"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - cloudformation:*
                  - kms:*
                  - sns:Publish
                  - lambda:*
                  - codestar-connections:UseConnection
                  - codebuild:*
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CFNRole.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      ArtifactStore:
        Location: "{{resolve:ssm:/nls-wordpress/pipeline/artefact-bucket}}"
        Type: S3
        EncryptionKey:
          Type: KMS
          Id: "{{resolve:ssm:/nls-wordpress/pipeline/kms-key-arn}}"
      Name: !Sub "${ApplicationName}-infra-pipelinebuilder-${Environment}"
      RoleArn: !GetAtt PipelineRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: "1"
                Provider: CodeStarSourceConnection
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
        - Name: DeployMainPipeline
          Actions:
            - Name: CreateChangeSet
              InputArtifacts:
                - Name: SourceArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                RoleArn: !GetAtt CFNRole.Arn
                StackName: !Sub "${ApplicationName}-main-infra-${Environment}"
                ChangeSetName: !Sub "${ApplicationName}-main-infra-${Environment}"
                TemplatePath: SourceArtifact::codepipeline.yml
                TemplateConfiguration: !Sub "SourceArtifact::pipeline-params/${Environment}.json"
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
              RunOrder: 1

            - !If
              - UseApproval
              - Name: ManualApproval
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Provider: Manual
                  Version: "1"
                Configuration:
                  CustomData: !Sub "Approve execution of ${Environment}"
                RunOrder: 2
              - !Ref AWS::NoValue

            - Name: ExecuteChangeSet
              InputArtifacts:
                - Name: SourceArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                RoleArn: !GetAtt CFNRole.Arn
                StackName: !Sub "${ApplicationName}-main-infra-${Environment}"
                ChangeSetName: !Sub "${ApplicationName}-main-infra-${Environment}"
              RunOrder: 3
